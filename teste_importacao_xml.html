<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProteínaFlow — Teste XML V3 3.12.0</title><style>body{font:16px system-ui;background:#f3f6f9;margin:0;padding:20px;color:#111827}main{max-width:850px;margin:auto;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:22px}button,input{font:inherit;padding:11px;margin:7px 0}.ok{background:#ecfdf5;border:1px solid #86efac;color:#166534;padding:14px;border-radius:12px;white-space:pre-wrap}.bad{background:#fff1f2;border:1px solid #fecaca;color:#991b1b;padding:14px;border-radius:12px;white-space:pre-wrap}.muted{color:#64748b}</style></head><body><main><h1>Teste do ZIP fiscal — V3 3.12.0</h1><p class="muted">Este teste não grava nada no Supabase. Ele confirma que o navegador consegue abrir o ZIP e ler os XMLs.</p><p id="lib"></p><input id="f" type="file" accept=".zip"><div id="sel" class="muted">Nenhum ZIP selecionado.</div><br><button id="go">Validar ZIP</button><pre id="out"></pre></main><script src="./assets/vendor/jszip.min.js?v=3.12.0"></script><script>
const out=document.querySelector('#out'),lib=document.querySelector('#lib');lib.textContent=window.JSZip?'JSZip carregado localmente: '+(JSZip.version||'OK'):'ERRO: JSZip não carregou';
const num=v=>Number(String(v||'0').replace(',','.'))||0;
function parseXmlText(txt,source='XML'){const raw=String(txt??'').replace(/^\uFEFF/,'').trim();if(!raw)throw new Error(source+': XML vazio');const x=new DOMParser().parseFromString(raw,'application/xml'),pe=x.getElementsByTagName('parsererror')[0];if(pe)throw new Error(source+': '+String(pe.textContent||'XML inválido').replace(/\s+/g,' ').trim().slice(0,220));return x}
document.querySelector('#go').onclick=async()=>{const file=document.querySelector('#f').files[0];if(!file){out.className='bad';out.textContent='Selecione um ZIP.';return}try{if(!window.JSZip)throw new Error('JSZip local não carregou.');out.className='';out.textContent='Abrindo ZIP…';const z=await JSZip.loadAsync(file),ents=Object.values(z.files).filter(e=>!e.dir&&/\.xml$/i.test(e.name)),canc=new Set(),parsed=[];for(let k=0;k<ents.length;k++){const e=ents[k],x=parseXmlText(await e.async('text'),e.name),tp=x.getElementsByTagNameNS('*','tpEvento')[0]?.textContent?.trim(),ch=x.getElementsByTagNameNS('*','chNFe')[0]?.textContent?.trim(),inf=x.getElementsByTagNameNS('*','infNFe')[0];if(tp==='110111'||(!inf&&ch&&x.getElementsByTagNameNS('*','infEvento').length)){if(ch)canc.add(ch);continue}if(inf)parsed.push({e,x,inf});if(k%50===0)out.textContent=`Lendo XMLs… ${k}/${ents.length}`;}let docs=new Set(),validDocs=new Set(),lines=0,validLines=0,business=0,net=0,gross=0,dates=[];for(let k=0;k<parsed.length;k++){const {e,x,inf}=parsed[k];const key=String(inf.getAttribute('Id')||'').replace(/^NFe/,''),ide=x.getElementsByTagNameNS('*','ide')[0],date=(ide?.getElementsByTagNameNS('*','dhEmi')[0]?.textContent||ide?.getElementsByTagNameNS('*','dEmi')[0]?.textContent||'').slice(0,10);docs.add(key);if(!canc.has(key))validDocs.add(key);if(date&&!canc.has(key))dates.push(date);for(const det of [...x.getElementsByTagNameNS('*','det')]){const p=det.getElementsByTagNameNS('*','prod')[0];if(!p)continue;lines++;if(canc.has(key))continue;validLines++;const get=t=>p.getElementsByTagNameNS('*',t)[0]?.textContent?.trim()||'';const value=Math.max(0,num(get('vProd'))-num(get('vDesc')));gross+=value;if(!(/^GORJETA$/i.test(get('xProd').trim())||get('cProd')==='99999')){business++;net+=value}}if(k%50===0)out.textContent=`Lendo XMLs… ${k}/${ents.length}`;}dates.sort();out.className='ok';out.textContent=`ZIP VÁLIDO ✓
XMLs no ZIP: ${ents.length}
Documentos fiscais válidos: ${validDocs.size}
Linhas fiscais válidas: ${validLines}
Linhas analisáveis sem gorjeta: ${business}
Cancelamentos: ${canc.size}
Período: ${dates[0]||'—'} a ${dates[dates.length-1]||'—'}
Venda fiscal líquida: R$ ${gross.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
Venda analisável sem gorjeta: R$ ${net.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}`;}catch(e){out.className='bad';out.textContent='FALHA: '+(e.message||e)}};
</script></body></html>
